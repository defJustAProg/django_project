{% extends 'base.html' %}
{% block title %}Список клиентов{% endblock %}
{% block content %}
<h1>Список клиентов</h1>

<!-- Filtering Form -->
<form method="get" class="filter-form">
    {{ filter.form.as_p }}
    <button type="submit">Фильтровать</button>
</form>

<ul>
    {% for customer in filter.qs %}
        <li>
            <a href="{% url 'customer_detail' customer.login %}">{{ customer.login }}</a>
        </li>
    {% empty %}
        <li>Нет клиентов.</li>
    {% endfor %}
</ul>
<a href="{% url 'customer_create' %}">Создать нового клиента</a>
{% endblock %}
